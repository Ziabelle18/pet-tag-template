<!-- Floating / Top Action Bar -->
<div class="action-bar">
  <button id="toggleEditBtn" class="btn-lock">
    🔒 Edit Card
  </button>
</div>

<!-- 1. LIVE PET DASHBOARD VIEW (Ito lang nakikita by default) -->
<div id="petDashboard" class="card-container">
  <img id="displayPhoto" src="default-pet.png" alt="Pet Photo" />
  <h2 id="displayName">Milo</h2>
  <p id="displayBreed">Golden Retriever</p>
  <p id="displayOwner">Owner: Maria Perez</p>
  <p id="displayAddress">Quezon City, Metro Manila</p>
  <a id="displayPhone" href="tel:+639123456789">📞 Call Owner</a>
</div>

<!-- 2. EDITOR PANEL (Naka-hide by default) -->
<div id="editorPanel" class="editor-container hidden">
  <h3>✏️ Pet Details Editor</h3>
  
  <!-- Form Inputs -->
  <input type="text" id="inputName" value="Milo" placeholder="Pet Name" />
  <input type="text" id="inputBreed" value="Golden Retriever" placeholder="Breed" />
  <input type="text" id="inputOwner" value="Maria Perez" placeholder="Owner Name" />
  <input type="text" id="inputPhone" value="+639123456789" placeholder="Phone Number" />
  
  <!-- Save Button -->
  <button id="saveBtn" class="btn-save">💾 Save Changes</button>
</div>
